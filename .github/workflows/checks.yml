# Проверки: тесты ядра и окна на Linux (настоящее распознавание на синтетических сканах и на реальных
# документах ЕСКД из tests/real-documents) и сборка
# установщика на Windows тем же сценарием, что на ПК (scripts/build.ps1). Установщик выкладывается
# файлом сборки (Actions → запуск → Artifacts) на 14 дней; выпусков (Releases) нет.
name: checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  tests:
    name: Тесты (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Tesseract и шрифт для тестов
        run: scripts/ci-ocr-deps.sh
      - name: Тесты ядра
        env:
          DTR_TEST_SAMPLES_OUTPUT: ${{ runner.temp }}/dtr-test-samples
          DTR_ONNX_MODELS_DIR: ${{ github.workspace }}/ocr/onnx
          DTR_GOST_OUTPUT: ${{ runner.temp }}/dtr-test-samples/gost-type-a
          DTR_GOST_V3_PDF_OUTPUT: ${{ runner.temp }}/dtr-test-samples/gost-type-a/v3-pdf-fixtures
          DTR_REAL_DOCS_OUTPUT: ${{ runner.temp }}/dtr-test-samples/real-documents
        run: dotnet test tests/Core.Tests -c Release --logger trx --results-directory artifacts/test-results/core
      - name: Тесты окна и установщика
        env:
          DTR_EDITOR_TEST_OUTPUT: ${{ runner.temp }}/dtr-test-samples/editor
          DTR_UI_PERFORMANCE_OUTPUT: ${{ runner.temp }}/dtr-performance/ui
        run: dotnet test tests/App.Tests -c Release --logger trx --results-directory artifacts/test-results/app
      - name: Замер полного OCR на PDF-образцах
        run: dotnet run --project tools/Performance -c Release -- --count 32 --workers 0 --profile-passes 0 --label ci-defaults --output "${{ runner.temp }}/dtr-performance/ocr.json"
      - name: Отчет тестов и проверенные PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-and-pdf-samples
          path: |
            artifacts/test-results
            ${{ runner.temp }}/dtr-test-samples
            ${{ runner.temp }}/dtr-performance
          retention-days: 14

  setup:
    name: Установщик (Windows)
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Сборка (scripts\build.ps1)
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Проверка чтения PDF на Windows
        shell: pwsh
        run: dotnet run --project tools/Performance -c Release -- --count 4 --workers 1 --profile-passes 0 --label windows-smoke --output "${{ runner.temp }}/ocr-windows.json"
      - name: Сверка движков, Unicode PDF, алфавитов полей и шрифта ГОСТ
        shell: pwsh
        env:
          DTR_ONNX_MODELS_DIR: ${{ github.workspace }}/ocr/onnx
          DTR_GOST_OUTPUT: ${{ runner.temp }}/gost-windows
          DTR_GOST_V3_PDF_OUTPUT: ${{ runner.temp }}/gost-windows/v3-pdf-fixtures
          DTR_REAL_DOCS_OUTPUT: ${{ runner.temp }}/real-documents-windows
        run: |
          $classes = @(
            'OnnxBackendTests',
            'TesseractProfileTests',
            'PdfTextReaderTests',
            'PdfTextConflictTests',
            'PdfTextExtractionTests',
            'PdfTextSelectionTests',
            'PdfAlphabetAgreementTests',
            'MixedBrandRulesTests',
            'CyrillicModelTests',
            'GostRawLineTests',
            'GostRoutingTests',
            'GostTypeATests',
            'GostTypeAPairedPdfTests',
            'GostTypeAV3',
            'RealDocumentTests'
          )
          $filter = ($classes | ForEach-Object { "FullyQualifiedName~$_" }) -join '|'
          dotnet test tests/Core.Tests -c Release --filter $filter --logger trx --results-directory artifacts/test-results/onnx-windows
      - name: Проверка опубликованной поставки в папке с кириллицей
        shell: pwsh
        run: ./scripts/check-published-ocr.ps1 -PublishedDirectory ./artifacts/setup/app -ReportsDirectory "${{ runner.temp }}/published-ocr-smoke"
      - name: Отчет OCR на Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-windows
          path: |
            ${{ runner.temp }}/ocr-windows.json
            ${{ runner.temp }}/published-ocr-smoke
            ${{ runner.temp }}/gost-windows
            ${{ runner.temp }}/real-documents-windows
            artifacts/test-results/onnx-windows
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: dist/*.exe
          retention-days: 14
          compression-level: 0
