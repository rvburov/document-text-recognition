name: performance-processes

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/performance-processes.yml']

permissions:
  contents: read

concurrency:
  group: performance-processes-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  windows:
    name: Отдельные OCR-процессы и фактические 8000 PDF (Windows)
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Сборка поставки и измерителя
        shell: pwsh
        run: |
          dotnet build tools/Performance -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/App.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Реальные subprocess-проверки, выход и отмена
        shell: pwsh
        run: |
          dotnet test tests/App.Tests -c Release --no-build --filter 'FullyQualifiedName~DocumentTextRecognition.AppTests.ProcessWorkerTests|FullyQualifiedName~DocumentTextRecognition.AppTests.ProcessWorkerLifecycleTests' --logger trx --results-directory '${{ runner.temp }}/processes-tests'
          if ($LASTEXITCODE -ne 0) { throw 'Real OCR subprocess tests failed.' }
          $trxFiles = @(Get-ChildItem '${{ runner.temp }}/processes-tests' -Filter '*.trx')
          if ($trxFiles.Count -ne 1) { throw 'Expected one subprocess test report.' }
          [xml]$trx = Get-Content $trxFiles[0].FullName -Raw
          $counters = $trx.SelectSingleNode("//*[local-name()='Counters']")
          if ($null -eq $counters -or [int]$counters.total -lt 21 -or [int]$counters.failed -ne 0 -or
              [int]$counters.notExecuted -ne 0 -or [int]$counters.executed -ne [int]$counters.total) {
            throw 'All real subprocess tests must execute and pass; missing/skipped OCR coverage is not accepted.'
          }
          $fivePdf = @($trx.SelectNodes("//*[local-name()='UnitTestResult']") | Where-Object {
            $_.testName -like '*Real_worker_reads_all_five_saved_templates_including_parentheses_exactly*'
          })
          if ($fivePdf.Count -ne 1 -or $fivePdf[0].outcome -ne 'Passed') {
            throw 'Expected the exact five-PDF subprocess test, including parentheses, to pass.'
          }
      - name: Пять режимов по 500 PDF на одной машине
        shell: pwsh
        run: |
          $env:DTR_BENCHMARK_CPU = @(Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name) -join '; '
          $reports = Join-Path '${{ runner.temp }}' 'processes'
          New-Item -ItemType Directory -Force -Path $reports | Out-Null
          $binaryRoot = Join-Path (Get-Location) 'artifacts/bin/Performance/release'
          function ModelHashes {
            $files = @(Get-ChildItem $binaryRoot -Recurse -Filter '*.onnx' | Sort-Object FullName)
            if ($files.Count -ne 2) { throw 'Expected exactly two supplied ONNX models.' }
            return @($files | ForEach-Object { [ordered]@{ File=$_.Name; Sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash } })
          }
          $modelHashes = ModelHashes | ConvertTo-Json -Compress
          $modelHashes | Set-Content (Join-Path $reports 'model-hashes.json')
          $modes = @(
            @{Label='thread-8-scalar-before'; Processes=$false; Workers=8; Avx2=$false},
            @{Label='process-4-scalar'; Processes=$true; Workers=4; Avx2=$false},
            @{Label='process-4-avx2'; Processes=$true; Workers=4; Avx2=$true},
            @{Label='process-8-avx2'; Processes=$true; Workers=8; Avx2=$true},
            @{Label='thread-8-scalar-after'; Processes=$false; Workers=8; Avx2=$false}
          )
          $runs = @()
          $datasetHash = $null
          $coreHash = $null
          foreach ($mode in $modes) {
            $label = "$($mode.Label)-500"
            $file = Join-Path $reports ($label + '.json')
            $processes = $mode.Processes.ToString().ToLowerInvariant()
            $avx2 = $mode.Avx2.ToString().ToLowerInvariant()
            dotnet run --project tools/Performance -c Release --no-build -- --count 500 --workers $mode.Workers --opencv-threads 1 --known-lines true --onnx true --dedicated-workers true --hamming-avx2 $avx2 --process-workers $processes --profile-passes 1 --label $label --output $file
            if ($LASTEXITCODE -ne 0) { throw "$label failed complete names/hashes validation." }
            $result = Get-Content $file -Raw | ConvertFrom-Json
            $expectedChildren = if ($mode.Processes) { $mode.Workers } else { 0 }
            if (!$result.Quality.Passed -or $result.Quality.VerifiedPdfHashes -ne 500 -or
                $result.Quality.IncorrectNames -ne 0 -or $result.Quality.Errors.Count -ne 0 -or
                $result.Measurement.Renamed -ne 500 -or $result.Measurement.Processed -ne 500 -or
                $result.Measurement.Skipped -ne 0 -or $result.Configuration.EffectiveWorkers -ne $mode.Workers -or
                $result.Configuration.ProcessWorkers -ne $mode.Processes -or
                $result.Configuration.ResolvedProcessWorkers -ne $mode.Processes -or
                $result.Configuration.HammingAvx2 -ne $mode.Avx2 -or
                $result.Configuration.ResolvedHammingAvx2 -ne $mode.Avx2 -or
                !$result.Environment.HammingAvx2Available -or !$result.Configuration.ResolvedKnownLines -or
                !$result.Configuration.ResolvedUsesOnnx -or !$result.Configuration.ResolvedDedicatedWorkers -or
                $result.Environment.OpenCvThreads -ne 1 -or
                $result.Measurement.WorkerProcessesStarted -ne $expectedChildren -or
                $result.Measurement.WorkerProcessesActiveAfterRun -ne 0 -or
                $result.Measurement.SampledPeakWorkerProcesses -gt $expectedChildren -or
                ($mode.Processes -and $result.Measurement.SampledPeakWorkerProcesses -lt 1) -or
                ($mode.Processes -and $result.Measurement.ChildCpuSeconds -le 0)) {
              throw "$label did not use the declared mode, leaked children, or failed quality checks."
            }
            if ($null -eq $datasetHash) {
              $datasetHash = $result.Dataset.DatasetSha256
              $coreHash = $result.Environment.CoreAssemblySha256
            }
            if ($result.Dataset.DatasetSha256 -ne $datasetHash -or
                $result.Environment.CoreAssemblySha256 -ne $coreHash -or
                (ModelHashes | ConvertTo-Json -Compress) -ne $modelHashes) {
              throw 'Inputs, models or Core changed between comparison runs.'
            }
            $runs += [pscustomobject]@{
              Label=$label; Processes=$mode.Processes; Workers=$mode.Workers; Avx2=$mode.Avx2
              WallSeconds=[double]$result.Measurement.WallSeconds
              ChildCpuSeconds=[double]$result.Measurement.ChildCpuSeconds
              PeakAggregateRssBytes=[long]$result.Measurement.SampledPeakWorkingSetBytes
              QualityPassed=$true
            }
          }
          $threads = @($runs | Where-Object { !$_.Processes })
          $candidates = @($runs | Where-Object Processes | Sort-Object WallSeconds)
          $winner = $candidates[0]
          $threadMean = ($threads | Measure-Object WallSeconds -Average).Average
          $bestThread = ($threads | Measure-Object WallSeconds -Minimum).Minimum
          $reduction = 1 - $winner.WallSeconds / $threadMean
          $accepted = $threads.Count -eq 2 -and $candidates.Count -eq 3 -and
            $reduction -ge 0.05 -and $winner.WallSeconds -lt $bestThread
          $reason = if ($accepted) { 'All quality checks passed; fastest process candidate is >=5% faster than mean thread control and beats both controls.' } else { 'No sufficiently clear >=5% full-pipeline improvement; preserve thread mode and skip 8000.' }
          [ordered]@{
            Accepted=$accepted; Reason=$reason; ThreadMeanSeconds=$threadMean; BestThreadSeconds=$bestThread
            RelativeTimeReduction=$reduction; SelectedWorkers=$winner.Workers; SelectedAvx2=$winner.Avx2
            SelectedLabel=$winner.Label; CoreAssemblySha256=$coreHash; DatasetSha256=$datasetHash; Runs=$runs
            Scope='One-VM operational comparison on repeated synthetic PDFs; not a formal statistical significance test. Aggregate RSS sums shared pages more than once.'
          } | ConvertTo-Json -Depth 12 | Set-Content (Join-Path $reports 'selection.json')
          "RUN_8000=$($accepted.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SELECTED_WORKERS=$($winner.Workers)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SELECTED_AVX2=$($winner.Avx2.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host $reason
      - name: Промежуточные отчеты до длительного прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-processes-selection-windows
          path: |
            ${{ runner.temp }}/processes
            ${{ runner.temp }}/processes-tests
          retention-days: 14
      - name: Фактические 8000 PDF в выбранном режиме
        if: env.RUN_8000 == 'true'
        shell: pwsh
        run: |
          $env:DTR_BENCHMARK_CPU = @(Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name) -join '; '
          $reports = Join-Path '${{ runner.temp }}' 'processes'
          $file = Join-Path $reports 'windows-processes-8000.json'
          dotnet run --project tools/Performance -c Release --no-build -- --count 8000 --workers $env:SELECTED_WORKERS --opencv-threads 1 --known-lines true --onnx true --dedicated-workers true --hamming-avx2 $env:SELECTED_AVX2 --process-workers true --profile-passes 1 --label windows-processes-8000 --output $file
          if ($LASTEXITCODE -ne 0) { throw '8000-document complete names/hashes validation failed.' }
          $result = Get-Content $file -Raw | ConvertFrom-Json
          $selection = Get-Content (Join-Path $reports 'selection.json') -Raw | ConvertFrom-Json
          $expectedAvx2 = $env:SELECTED_AVX2 -eq 'true'
          if (!$result.Quality.Passed -or $result.Quality.VerifiedPdfHashes -ne 8000 -or
              $result.Quality.IncorrectNames -ne 0 -or $result.Quality.Errors.Count -ne 0 -or
              $result.Measurement.Processed -ne 8000 -or $result.Measurement.Renamed -ne 8000 -or
              $result.Measurement.Skipped -ne 0 -or !$result.Configuration.ResolvedProcessWorkers -or
              $result.Configuration.ResolvedHammingAvx2 -ne $expectedAvx2 -or
              !$result.Configuration.ResolvedUsesOnnx -or !$result.Configuration.ResolvedKnownLines -or
              $result.Configuration.EffectiveWorkers -ne [int]$env:SELECTED_WORKERS -or
              $result.Measurement.WorkerProcessesStarted -ne [int]$env:SELECTED_WORKERS -or
              $result.Measurement.WorkerProcessesActiveAfterRun -ne 0 -or
              $result.Measurement.SampledPeakWorkerProcesses -lt 1 -or $result.Measurement.ChildCpuSeconds -le 0 -or
              $result.Dataset.DatasetSha256 -ne $selection.DatasetSha256 -or
              $result.Environment.CoreAssemblySha256 -ne $selection.CoreAssemblySha256) {
            throw '8000-document final mode, child-process lifecycle or quality checks failed.'
          }
          [ordered]@{
            QualityPassed=$true; Documents=8000; MeasuredMinutes=$result.Measurement.Measured8000Minutes
            Goal20MinutesMet=([double]$result.Measurement.WallSeconds -le 1200)
            Comparison='Actual current-run time; historical 22:29 is a different VM, not a controlled speedup comparison.'
          } | ConvertTo-Json | Set-Content (Join-Path $reports 'actual-8000-summary.json')
      - name: Все отчеты, включая отказ от нового режима
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-processes-windows
          path: |
            ${{ runner.temp }}/processes
            ${{ runner.temp }}/processes-tests
          retention-days: 14
