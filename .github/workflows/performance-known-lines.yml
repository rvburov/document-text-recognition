name: performance-known-lines

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/performance-known-lines.yml']

permissions:
  contents: read

concurrency:
  group: performance-known-lines-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  windows:
    name: Известные области и полный OCR на одном Windows-стенде
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Сборка инструментов
        shell: pwsh
        run: |
          dotnet build tools/Performance -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tools/PerformanceVerify -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Проверка всех пяти исходных PDF
        shell: pwsh
        run: |
          $reports = Join-Path '${{ runner.temp }}' 'known-lines'
          New-Item -ItemType Directory -Force -Path $reports | Out-Null
          dotnet run --project tools/PerformanceVerify -c Release --no-build -- docs/test-samples (Join-Path $reports 'five-baseline.json') --known-lines false
          if ($LASTEXITCODE -ne 0) { Write-Warning 'Baseline has an incorrect accepted name; retained its report.' }
          dotnet run --project tools/PerformanceVerify -c Release --no-build -- docs/test-samples (Join-Path $reports 'five-candidate.json') --known-lines true
          if ($LASTEXITCODE -ne 0) { throw 'Candidate accepted an incorrect name.' }
          $candidate = Get-Content (Join-Path $reports 'five-candidate.json') -Raw | ConvertFrom-Json
          if ($candidate.Correct -ne 5 -or $candidate.Rejected -ne 0) { throw 'Expected all five exact names, including the parentheses example.' }
      - name: Три прогона по 1000 PDF с профилем этапов
        shell: pwsh
        run: |
          $env:DTR_BENCHMARK_CPU = @(Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name) -join '; '
          $reports = Join-Path '${{ runner.temp }}' 'known-lines'
          foreach ($mode in @(@{Known='false'; Workers=8}, @{Known='true'; Workers=4}, @{Known='true'; Workers=8})) {
            $label = "known-$($mode.Known)-workers-$($mode.Workers)"
            dotnet run --project tools/Performance -c Release --no-build -- --count 1000 --workers $mode.Workers --known-lines $mode.Known --profile-passes 1 --label $label --output (Join-Path $reports "$label.json")
            if ($LASTEXITCODE -ne 0) { throw "$label failed names/hashes validation." }
          }
      - name: Все отчеты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-known-lines-windows
          path: ${{ runner.temp }}/known-lines
          retention-days: 14
